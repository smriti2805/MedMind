<div class="relative w-full max-w-4xl mx-auto overflow-hidden rounded-lg min-h-[80vh]">
  <div class="carousel relative w-full">
    {% for slide in slides %}
    <div class="carousel-item absolute inset-0 hidden">
      <img src="{{ url_for('static', filename=slide.file) }}" 
           alt="Slide {{ loop.index }}" 
           class="w-full object-cover rounded-lg min-h-[80vh]">
      <div class="absolute inset-0 flex flex-col items-center justify-end text-white text-3xl font-bold min-h-[80vh]">
        <div class=" bg-black/50 m-5">
          {{ slide.caption }}
        </div>
          <div class="h-[10%]">
        </div>
      </div>
    </div>
    {% endfor %}
  </div>

  <!-- Dots -->
  <div class="absolute bottom-2 left-0 right-0 flex justify-center space-x-2">
    {% for slide in slides %}
    <span class="dot w-3 h-3 bg-gray-400 rounded-full"></span>
    {% endfor %}
  </div>
</div>


<style>
.carousel-item {
  display: none;
  animation: fade 1s ease-in-out;
}

@keyframes fade {
  from { opacity: 1; }
  to { opacity: 1; }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  let slides = document.querySelectorAll(".carousel-item");
  let dots = document.querySelectorAll(".dot");
  let currentIndex = 0;
  let intervalTime = 3000; // 10 seconds per image

  function showSlide(index) {
    slides.forEach((slide, i) => {
      slide.style.display = (i === index) ? "block" : "none";
      dots[i].classList.toggle("bg-green-500", i === index);  // active dot
      dots[i].classList.toggle("bg-gray-400", i !== index);  // inactive dot
    });
  }

  function nextSlide() {
    currentIndex = (currentIndex + 1) % slides.length;
    showSlide(currentIndex);
  }

  // initialize first slide
  showSlide(currentIndex);
  setInterval(nextSlide, intervalTime);
});
</script>
