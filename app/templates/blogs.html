{% extends "base.html" %}

{% block title %} Blogs - MedMind {% endblock %}

{% block head %}
<!-- You can add additional CSS if needed -->
{% endblock %}

{% block content %}
<div class="grid grid-cols-1 md:grid-cols-3 gap-8 min-h-[76vh] m-2">
    {% for blog in blog_posts %}
    <div class="bg-med-gray rounded-xl shadow-lg overflow-hidden transform transition duration-300 ease-in-out hover:shadow-2xl hover:scale-[1.02]">
        <img src="{{ url_for('main.blog_image_file', filename=blog.imageUrl) }}" 
             alt="{{ blog.title }}" 
             class="w-full h-70 object-cover object-top">

        <div class="p-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-3">{{ blog.title }}</h2>
            <p class="text-gray-500 text-sm mb-4">By {{ blog.author }} • {{ blog.date }}</p>
            <p class="text-gray-700">{{ blog.summary }}</p>
            <a href="{{ url_for('main.blog_detail', blog_id=blog.id) }}" 
               class="mt-4 inline-block text-blue-600 hover:underline">Read More →</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
