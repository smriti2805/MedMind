{% extends "base.html" %}

{% block title %} Blogs - MedMind {% endblock %}

{% block head %}
<!-- You can add additional CSS if needed -->
{% endblock %}

{% block content %}
<div class="grid grid-cols-1 md:grid-cols-3 gap-8 min-h-[76vh]">
    {% for blog in blog_posts %}
    <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300">
        <img src="{{ url_for('static', filename=blog.image) }}" 
             alt="{{ blog.title }}" 
             class="w-full h-48 object-cover">

        <div class="p-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-3">{{ blog.title }}</h2>
            <p class="text-gray-500 text-sm mb-4">By {{ blog.author }} • {{ blog.date }}</p>
            <p class="text-gray-700">{{ blog.summary }}</p>
            <a href="{{ url_for('blog_detail', blog_id=blog.id) }}" 
               class="mt-4 inline-block text-blue-600 hover:underline">Read More →</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
