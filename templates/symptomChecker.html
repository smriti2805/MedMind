{% extends "base.html" %}

{% block title %}Symptom Checker - MedMind{% endblock %}

{% block content %}
<div class="bg-gray-50 min-h-screen px-4 py-12">
    <div class="max-w-4xl mx-auto space-y-8">

        <div class="bg-white p-8 rounded-2xl shadow-lg">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Symptom Checker</h1>
                <p class="text-gray-500 mt-2">Describe your symptoms and/or upload images for an initial analysis.</p>
            </div>

            <!-- Text Input for Symptoms -->
            <div>
                <label for="symptom-text-input" class="block text-sm font-medium text-gray-700 mb-1">Describe
                    Symptoms</label>
                <textarea id="symptom-text-input" name="query" rows="4"
                    placeholder="Type your symptoms here (e.g., 'sore throat, headache, and a rash on my arm')..."
                    class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
            </div>

            <!-- Image Upload Section -->
            <div class="mt-6">
                <label class="block text-sm font-medium text-gray-700">Upload Images (Optional)</label>
                <!-- Grid for displaying image previews -->
                <div id="symptom-image-preview-grid"
                    class="mt-2 grid grid-cols-[repeat(auto-fill,minmax(100px,1fr))] gap-4 min-h-[116px] p-4 bg-gray-50 rounded-lg border border-gray-200">
                    <!-- Image previews will be added here -->
                </div>
            </div>

            <!-- Hidden file input triggered by the button below -->
            <input type="file" id="symptom-image-upload-input" accept="image/*" class="hidden" multiple>

            <!-- "Add Image" and "Check Symptoms" buttons -->
            <div class="mt-6 flex flex-col sm:flex-row gap-4">
                <label for="symptom-image-upload-input"
                    class="w-full sm:w-auto flex items-center justify-center px-5 py-3 bg-indigo-50 text-indigo-700 border-2 border-dashed border-indigo-200 rounded-lg cursor-pointer font-bold hover:bg-indigo-100 transition-colors">
                    <span class="text-2xl mr-2">+</span>
                    Add Image
                </label>
                <button id="check-symptoms-btn"
                    class="w-full sm:flex-1 p-3 border-none rounded-xl bg-gradient-to-r from-blue-500 to-cyan-400 text-white text-lg font-bold cursor-pointer hover:shadow-lg hover:shadow-cyan-500/50 hover:-translate-y-0.5 transition-all">
                    Check Symptoms
                </button>
            </div>
        </div>

        <div id="symptom-results-container" class="bg-white p-8 rounded-2xl shadow-lg hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Possible Conditions</h2>
            <div id="symptom-results-content" class="prose lg:prose-lg max-w-none text-gray-600">
                <!-- Results will be injected here -->
            </div>
        </div>

    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    const API_ENDPOINT = "{{ url_for('symptom_checker_proxy') }}";
</script>
<script type="module" src="{{ url_for('static', filename='js/symptomChecker.js') }}"></script>
{% endblock %}
