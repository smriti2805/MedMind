<div class="p-4 bg-blue-600 text-white font-bold text-center rounded-xl relative">
    MedMind Health Assistant
</div>
<div class="flex flex-grow flex-col min-h-[62vh] h-[62vh]">
    <div id="chatbot-messages" class="p-1 pt-2 overflow-y-auto inline-flex flex-col w-full">
        <div class="message bot-message text-left flex flex-row gap-1 bg-black/20 rounded-lg p-2 my-1">
            <div class="size-8">
                {{ icons.icon("bot_avatar") }}
            </div>
            <div>
                Hello! How can I assist you with your health today?
            </div>
        </div>
    </div>
        <div id="typing-indicator"
            class="message bot-message text-left flex flex-row gap-1 bg-black/20 rounded-lg p-2 my-1 hidden">
            <div class="size-8">
                {{ icons.icon("bot_avatar") }}
            </div>
            <div class="typing-indicator">
                <span></span><span></span><span></span>
            </div>
        </div>
</div>
<div class="flex p-2 border-t border-gray-300 items-center">
    <!-- Image Upload Button -->
    <label for="chatbot-image" class="cursor-pointer w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center mr-2">
        📷
    </label>
    <input type="file" id="chatbot-image" accept="image/*" class="hidden">

    <!-- Text Input -->
    <input type="text" id="chatbot-input" placeholder="Type a message..."
        class="flex-grow border border-gray-400 rounded-full px-4 py-2 mr-2 outline-none">

    <!-- Send Button -->
    <button id="chatbot-send-button" class="w-10 h-10 rounded-full bg-blue-600 text-white text-base cursor-pointer p-1">
        {{ icons.icon("send_button") }}
    </button>
</div>

<style>
    .typing-indicator {
        display: flex;
        gap: 4px;
        align-items: center;
        margin: 5px 0;
    }

    .typing-indicator span {
        width: 8px;
        height: 8px;
        background: #555;
        border-radius: 50%;
        display: inline-block;
        animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-indicator span:nth-child(1) {
        animation-delay: -0.32s;
    }

    .typing-indicator span:nth-child(2) {
        animation-delay: -0.16s;
    }

    .typing-indicator span:nth-child(3) {
        animation-delay: 0;
    }

    @keyframes bounce {

        0%,
        80%,
        100% {
            transform: scale(0.6);
            opacity: 0.6;
        }

        40% {
            transform: scale(1);
            opacity: 1;
        }
    }
</style>
<script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
