{% macro chatbot(height="62vh", name="MedMind Health Assistant", first_message="Hello! How can I assist you with your
health today?", api_url="stream_chat_proxy") %}
{% import "components/icons.html" as icons %}
<div class="p-4 bg-blue-600 text-white font-bold text-center rounded-xl relative text-2xl">
    {{name}}
</div>
<div class="flex flex-grow flex-col min-h-[32vh] h-[{{height}}]">
    <div id="chatbot-messages" class="p-1 pt-2 overflow-y-auto inline-flex flex-col w-full">
        <div class="message bot-message text-left flex flex-row gap-1 bg-black/20 rounded-lg p-2 my-1">
            <div class="size-8">
                {{ icons.icon("bot_avatar") }}
            </div>
            <div>
                {{first_message}}
            </div>
        </div>
    </div>
</div>
<div class="flex p-2 border-t border-gray-300 items-end">
    <div id="image-preview-container" class="hidden relative mr-2 w-[200px] h-[200px] rounded-lg overflow-hidden">
    </div>
    <label for="chatbot-image-input"
        class="cursor-pointer w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center mr-2">
        {{ icons.icon("camera") }}
    </label>
    <input type="file" id="chatbot-image-input" accept="image/*" class="hidden">
    <input type="text" id="chatbot-input" placeholder="Type a message..."
        class="flex-grow border border-gray-400 rounded-full px-4 py-2 mr-2 outline-none">
    <button id="chatbot-send-button"
        class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center cursor-pointer p-1">
        {{ icons.icon("send") }}
    </button>
</div>
<script>
    const api_url = "{{ url_for(api_url) }}";
</script>
{% endmacro %}
