{% extends "base.html" %}
{% block title %} Contact - MedMind {% endblock %}

{% block content %}
<div class="container mx-auto px-6 py-12">

  <div class="text-center mb-10">
    <h1 class="text-4xl font-extrabold text-gray-800">We’re here to help.</h1>
    <p class="text-lg text-gray-600 mt-2">Reach out to us anytime.</p>
  </div>

  <div class="grid md:grid-cols-2 gap-12 items-center">

    <div class="hidden md:flex justify-center">
      <img src="{{ url_for('static', filename='images/10.png') }}" alt="Support Illustration" class="w-full max-w-sm object-contain">
    </div>

    <div>
      <div class="text-center md:text-left mb-6">
        <h3 class="text-xl font-semibold">Contact Info</h3>
        <p class="text-gray-600">Email: <span class="font-medium">support@medmind.com</span></p>
        <p class="text-gray-600">Phone: <span class="font-medium">+91 1234567890</span></p>
      </div>

      <form id="contact-form" action="{{ url_for('contact') }}" method="POST" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="name" placeholder="Your Name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
        <input type="email" name="email" placeholder="Your Email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
        <textarea name="message" placeholder="Your Message" rows="4" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none"></textarea>
        
        <button id="send-button" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold transition-colors disabled:bg-gray-400">
          Send Message
        </button>
      </form>
      
      <p id="form-status" class="text-center mt-4 font-medium"></p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/contact.js') }}"></script>
{% endblock %}
