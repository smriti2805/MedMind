{% extends "base.html" %}
{% block title %} Lab Report- MedMind {% endblock %}
{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="max-w-3xl w-full bg-white p-8 rounded-2xl shadow-lg">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Lab Report Analysis</h1>
      <p class="text-gray-500 mt-2">Upload one or more lab report images for analysis.</p>
    </div>

    <div id="image-preview-grid"
      class="grid grid-cols-[repeat(auto-fill,minmax(140px,1fr))] gap-4 mb-8 min-h-[160px] p-4 bg-gray-50 rounded-lg border border-gray-200">
    </div>

    <label for="report-upload-input"
      class="w-full flex items-center justify-center px-5 py-3 bg-indigo-50 text-indigo-700 border-2 border-dashed border-indigo-200 rounded-lg cursor-pointer font-bold hover:bg-indigo-100 transition-colors">
      <span class="text-2xl mr-2">+</span>
      Add Image
    </label>
    <input type="file" id="report-upload-input" accept="image/*" class="hidden">

    <button id="generate-analysis-btn"
      class="w-full mt-8 p-4 border-none rounded-xl bg-gradient-to-r from-blue-500 to-cyan-400 text-white text-lg font-bold cursor-pointer hover:shadow-lg hover:shadow-cyan-500/50 hover:-translate-y-0.5 transition-all">
      Generate Analysis
    </button>

    <div id="analysis-results-container"
      class="results-container mt-8 p-6 bg-gray-50 rounded-xl text-left border border-gray-200 hidden">
      <h2 class="text-xl font-bold text-gray-700 mb-4">Analysis Results</h2>
      <div id="analysis-results-content" class="text-gray-600">
      </div>
    </div>

  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const closeIcon = `{{ icons.icon("close", size="8px")}}`;
const API_ENDPOINT = "{{ url_for('analyze_reports_proxy') }}"
</script>
<script type="module" src="{{ url_for('static', filename='js/labReportAnalysis.js') }}"></script>
{% endblock %}
